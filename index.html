<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Relic Valuer — Refinement Selector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Warframe Relic Valuer</h1>
        <div class="search-controls">
            <input type="text" id="search-bar" placeholder="Search relic or item...">
            <select id="vault-filter">
                <option value="all">All Relics</option>
                <option value="vaulted">Vaulted</option>
                <option value="not-vaulted">Unvaulted</option>
            </select>
            <select id="refinement-filter">
                <option value="intact">Intact</option>
                <option value="exceptional">Exceptional</option>
                <option value="flawless">Flawless</option>
                <option value="radiant">Radiant</option>
            </select>
            <select id="sort-filter">
                <option value="total-sell-desc">Sort by: Total Sell (High to Low)</option>
                <option value="total-sell-asc">Sort by: Total Sell (Low to High)</option>
                <option value="total-buy-desc">Sort by: Total Buy (High to Low)</option>
                <option value="total-buy-asc">Sort by: Total Buy (Low to High)</option>
                <option value="avg-sell-desc">Sort by: Avg Sell (High to Low)</option>
                <option value="avg-sell-asc">Sort by: Avg Sell (Low to High)</option>
                <option value="avg-buy-desc">Sort by: Avg Buy (High to Low)</option>
                <option value="avg-buy-asc">Sort by: Avg Buy (Low to High)</option>
            </select>
        </div>
    </header>

    <div id="last-updated" class="last-updated"></div>
    
    <div id="relics-container"></div>

    <script src="script.js"></script>
</body>
</html>
