name: Run Relic Scraper and Price Fetcher

on:
  schedule:
    - cron: '0 9 * * 1'  # Runs every Monday at 9 AM UTC
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests beautifulsoup4

      - name: Run Relic Scraper
        run: python relicScraper.py

      - name: Run Price Fetcher
        run: python relicPrices.py

      - name: Configure Git
        run: |
          git config --global user.name "Akash-Brar"
          git config --global user.email "akashbrar467@gmail.com"

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git add Relics.json RelicValues.json last_updated.json
          git commit -m "Auto updated Relics.json, RelicValues.json and last_updated.json [GitHub Actions]" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
